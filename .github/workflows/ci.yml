name: ci

# The kit's whole value is that a number it prints means something. So CI does two things:
# it runs the suite, and it runs the demo end to end, because the failure mode that matters is
# a detector that still returns a number after it has stopped being right.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: the demo runs from a clean checkout
        run: |
          python demo/make_samples.py
          python -m seam score demo/composite.png --json > /tmp/flagged.json
          python -m seam score demo/untouched.png --json > /tmp/clean.json
          python tools/assert_demo.py /tmp/flagged.json /tmp/clean.json
